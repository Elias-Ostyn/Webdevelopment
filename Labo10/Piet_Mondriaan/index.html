<!DOCTYPE html>
<html lang="nl">

    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row g-0">

        <!-- A -->
        <div id="a" class="col-3">A</div>

        <!-- C (grote rood) -->

        <!-- F -->
        <div id="f" class="col-3">F</div>
    </div>

    <div class="row g-0">

        <!-- B -->
        <div id="b" class="col-3">B</div>

        <!-- tussenruimte onder C -->
        <div class="col-6 border-black border-end border-3"></div>

        <!-- G -->
        <div id="g" class="col-3">G</div>
    </div>

    <div class="row g-0">

        <!-- D -->
        <div id="d" class="col-3">D</div>

        <!-- E -->
        <div id="e" class="col-6">E</div>

        <div class="col-3"></div>
