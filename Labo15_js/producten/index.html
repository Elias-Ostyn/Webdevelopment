<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <title>producten</title>
</head>
<body>
<h2>Opdracht: producten</h2>

<table>
    <thead>
    <tr>
        <th>product</th>
        <th>prijs</th>
        <th>aantal</th>
        <th>btw</th>
        <th>subtotaal</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>product 1</td>
        <td class="prijs">10.00 Eur</td>
        <td><input type="number" class="aantal" value="0" min="0" step="0.5"></td>
        <td class="btw">6%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>
    <tr>
        <td>product 2</td>
        <td class="prijs">15.00 Eur</td>
        <td><input type="number" class="aantal" value="0" min="0" step="0.5"></td>
        <td class="btw">21%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>
    <tr>
        <td>product 3</td>
        <td class="prijs">12.20 Eur</td>
        <td><input type="number" class="aantal" value="0" min="0" step="0.5"></td>
        <td class="btw">21%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>
    <tr class="totaalrij">
        <td colspan="4">totaal</td>
        <td id="totaal">0.00 Eur</td>
    </tr>
    </tbody>
</table>

<button id="herbereken">Herbereken</button>


<script src="scripts/code.js"></script>
</body>
</html>
