<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>extra_oef</title>
</head>
<body>
<form>
    <label for="postcode">Post-code (1000 tot 9920):</label><br>
    <input
            type="text"
            id="postcode"
            name="postcode"
            pattern="^(?:[1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-1][0-9]|9920)$"
            required
    >
    <!-- ^ = begin van de invoer
         $ = einde van de invoer
        (?: ... ) = groep met verschillende toegestane opties
         -->
    <button type="submit">Verzenden</button>
</form>
</body>
</html>
